; Black Veil - Engine Configuration
; Target: Unreal Engine 5.3+

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/MainMenu.MainMenu
EditorStartupMap=/Game/Maps/M01.M01
GlobalDefaultGameMode=/Script/BlackVeil.BVGameMode

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/BlackVeil")

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
; Lumen gives the dynamic light-and-shadow gameplay the stealth system depends on.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AntiAliasing=2
r.SkinCache.CompileShaders=True
r.MobileHDR=True
r.AllowStaticLighting=False

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False
bInitialBuildingLocked=False

; Agent geometry lives on the RecastNavMesh, which is where UE5 actually reads it.
[/Script/NavigationSystem.RecastNavMesh]
AgentRadius=42.000000
AgentHeight=192.000000
AgentMaxStepHeight=35.000000

[/Script/Engine.AudioSettings]
DefaultSoundClassName=/Engine/EngineSounds/Master.Master
DefaultSoundConcurrencyName=/Engine/EngineSounds/DefaultSoundConcurrency.DefaultSoundConcurrency

[/Script/AudioMixer.AudioMixerBlueprintLibrary]

[/Script/Engine.CollisionProfile]
; Custom object channel for interaction traces.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="Interact")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="AIVision")

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

[/Script/Engine.WorldSettings]
DefaultGameMode=/Script/BlackVeil.BVGameMode
